# Self-hosted Nintendo WFC server for the esp32-wiimmfi bridge.
#
# Run this on a Linux LAN box (e.g. a Raspberry Pi / home server). Point the
# ESP32 sketch's WFC_REDIRECT_IP at this box's LAN IP, and the DS will reach
# every *.nintendowifi.net service here.
#
#   cp .env.example .env   # then edit credentials
#   docker compose up -d --build
#
# See the README "Self-hosted server" section for the full walkthrough.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wwfc
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Upstream schema is imported automatically on first init only.
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # No published ports: Postgres is reachable only by wwfc over the private
    # wfcnet bridge (as host "db"), never from the host or LAN.
    networks:
      - wfcnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d wwfc"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  wwfc:
    build:
      context: ./server
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wfcnet
    # Publish ONLY the WFC ports the DS/Wii actually connect to. Everything else
    # (Postgres, the internal RPC channels on 29997-29999) stays on the private
    # bridge and is never exposed.
    ports:
      - "80:80/tcp"        # NAS auth + Pokemon HTTP (GTS, Mystery Gift)
      - "28910:28910/tcp"  # serverbrowser
      - "29900:29900/tcp"  # gpcm (login)
      - "29901:29901/tcp"  # gpsp (profile search)
      - "29920:29920/tcp"  # gamestats
      - "27900:27900/udp"  # qr2 (heartbeats)
      - "27901:27901/udp"  # natneg (matchmaking)
      # NOTE: on a bridge network Docker SNATs inbound UDP, so the server sees
      # the docker gateway instead of the real client IP/port. Login/conntest
      # and most play work fine; peer-to-peer matchmaking (NatNeg) is the part
      # that can suffer. If matchmaking misbehaves, switch wwfc to a macvlan
      # network (gives it its own LAN IP) or back to network_mode: host.
    environment:
      BIND_ADDRESS: 0.0.0.0
      DB_ADDRESS: db        # resolves to the db service over the wfcnet bridge
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_SECRET: ${API_SECRET}
    volumes:
      # Persist runtime state (session/group .gob files, uuid) across restarts.
      - ./server/state:/app/state
      # Optional: drop SBCM/NAS payload binaries here to auto-patch unmodified
      # clients. Without them, pre-patch games with the WiiLink wfc-patcher.
      # - ./server/payload:/app/payload:ro
    restart: unless-stopped

# Private bridge network for container-to-container traffic (wwfc <-> db).
networks:
  wfcnet:
    driver: bridge

volumes:
  pgdata:
